<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .calculator {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .display {
            background: #0f3460;
            color: #e94560;
            font-size: 2rem;
            text-align: right;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 60px;
            word-wrap: break-word;
            max-height: 100px;
            overflow-y: auto;
        }
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .mode-toggle .basic {
            background: #e94560;
            color: #fff;
        }
        .mode-toggle .scientific {
            background: #533483;
            color: #fff;
        }
        .mode-toggle button:hover {
            opacity: 0.8;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .buttons.scientific {
            grid-template-columns: repeat(5, 1fr);
        }
        button {
            font-size: 1.2rem;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .number {
            background: #1a1a2e;
            color: #fff;
        }
        .number:hover {
            background: #2a2a4e;
        }
        .operator {
            background: #e94560;
            color: #fff;
        }
        .operator:hover {
            background: #ff6b6b;
        }
        .sci-op {
            background: #533483;
            color: #fff;
            font-size: 1rem;
        }
        .sci-op:hover {
            background: #6b44a0;
        }
        .equals {
            background: #0f3460;
            color: #e94560;
        }
        .equals:hover {
            background: #1a4a7a;
        }
        .clear {
            background: #533483;
            color: #fff;
        }
        .clear:hover {
            background: #6b44a0;
        }
        .history {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            max-height: 450px;
            overflow-y: auto;
        }
        .history h3 {
            color: #e94560;
            margin-bottom: 15px;
            text-align: center;
        }
        .history-item {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #fff;
        }
        .history-item .expression {
            font-size: 0.9rem;
            color: #888;
        }
        .history-item .result {
            font-size: 1.2rem;
            color: #e94560;
            margin-top: 5px;
        }
        .history-item:hover {
            background: #1a4a7a;
            cursor: pointer;
        }
        .clear-history {
            width: 100%;
            padding: 10px;
            background: #533483;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
            .history {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display" id="display">0</div>

            <div class="mode-toggle">
                <button class="basic" onclick="switchMode('basic')">Basic</button>
                <button class="scientific" onclick="switchMode('scientific')">Scientific</button>
            </div>

            <div class="buttons" id="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendValue('/')">/</button>
                <button class="operator" onclick="appendValue('*')">*</button>
                <button class="operator" onclick="backspace()">DEL</button>

                <button class="number" onclick="appendValue('7')">7</button>
                <button class="number" onclick="appendValue('8')">8</button>
                <button class="number" onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('-')">-</button>

                <button class="number" onclick="appendValue('4')">4</button>
                <button class="number" onclick="appendValue('5')">5</button>
                <button class="number" onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button class="number" onclick="appendValue('1')">1</button>
                <button class="number" onclick="appendValue('2')">2</button>
                <button class="number" onclick="appendValue('3')">3</button>
                <button class="equals" onclick="calculate()">=</button>

                <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
                <button class="number" onclick="appendValue('.')">.</button>
            </div>
        </div>

        <div class="history">
            <h3>History</h3>
            <div id="history-list"></div>
            <button class="clear-history" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentValue = '0';
        let history = [];
        let isScientific = false;

        const scientificButtons = [
            'sin(', 'cos(', 'tan(', 'log(', 'ln(',
            'sqrt(', 'pow(', '(', ')', '%'
        ];

        function updateDisplay() {
            display.textContent = currentValue;
        }

        function appendValue(val) {
            if (currentValue === '0' && val !== '.') {
                currentValue = val;
            } else {
                currentValue += val;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentValue = '0';
            updateDisplay();
        }

        function backspace() {
            currentValue = currentValue.slice(0, -1) || '0';
            updateDisplay();
        }

        function calculate() {
            try {
                let result = eval(currentValue);
                if (result === Infinity || result === -Infinity || isNaN(result)) {
                    addToHistory(currentValue, 'Error');
                    currentValue = 'Error';
                } else {
                    addToHistory(currentValue, result);
                    currentValue = String(parseFloat(result.toFixed(10)));
                }
            } catch (e) {
                addToHistory(currentValue, 'Error');
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function addToHistory(expression, result) {
            history.unshift({ expression, result });
            if (history.length > 50) history.pop();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = history.map((item, i) => `
                <div class="history-item" onclick="useHistoryItem(${i})">
                    <div class="expression">${item.expression}</div>
                    <div class="result">= ${item.result}</div>
                </div>
            `).join('');
        }

        function useHistoryItem(index) {
            currentValue = String(history[index].result);
            updateDisplay();
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function switchMode(mode) {
            const buttons = document.getElementById('buttons');
            const basicBtns = buttons.querySelectorAll('.sci-op');

            if (mode === 'scientific') {
                isScientific = true;
                buttons.classList.add('scientific');
                basicBtns.forEach(btn => btn.remove());

                const row4 = buttons.children[13];
                scientificButtons.forEach((label, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'sci-op';
                    btn.textContent = label;
                    btn.onclick = () => appendValue(label);
                    if (i < 5) {
                        buttons.insertBefore(btn, buttons.children[i + 1]);
                    } else {
                        buttons.insertBefore(btn, buttons.children[14]);
                    }
                });
            } else {
                isScientific = false;
                buttons.classList.remove('scientific');
                buttons.querySelectorAll('.sci-op').forEach(btn => btn.remove());
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendValue(e.key);
            else if (e.key === '.') appendValue('.');
            else if (e.key === '+') appendValue('+');
            else if (e.key === '-') appendValue('-');
            else if (e.key === '*') appendValue('*');
            else if (e.key === '/') appendValue('/');
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Backspace') backspace();
            else if (e.key === 'Escape') clearDisplay();
            else if (e.key === '%') appendValue('%');
            else if (e.key === '(' || e.key === ')') appendValue(e.key);
        });
    </script>
</body>
</html>
