<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Analyst's Journal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#fbf9f9",
                        primary: "#8f000d",
                        "on-surface": "#1b1c1c",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#5a403e",
                        "surface-variant": "#e4e2e2",
                        "primary-container": "#b22222"
                    },
                    spacing: {
                        "section-gap": "80px",
                        "margin-mobile": "16px",
                        "reading-column": "720px",
                        "container-max": "1200px",
                        base: "8px",
                        gutter: "24px"
                    },
                    fontFamily: {
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Merriweather"],
                        "headline-lg": ["Merriweather"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "700" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen">
    <!-- Login Section -->
    <div id="login-section" class="max-w-md mx-auto py-12 px-6">
        <h1 class="text-headline-lg font-headline-lg mb-8 text-center">Admin Login</h1>
        <div id="login-form-container">
            <form id="login-form" class="flex flex-col gap-6">
                <div>
                    <label class="block text-label-caps font-label-caps mb-2">Email</label>
                    <input type="email" id="login-email" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
                </div>
                <div>
                    <label class="block text-label-caps font-label-caps mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
                </div>
                <button type="submit" class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase hover:bg-primary-container transition-colors duration-200">
                    Login
                </button>
                <p id="login-msg" class="text-body-md text-center hidden"></p>
            </form>
        </div>

        <div id="setup-form-container" class="hidden">
            <p class="text-body-md text-on-surface-variant mb-6 text-center">Create your admin account (first time setup)</p>
            <form id="setup-form" class="flex flex-col gap-6">
                <div>
                    <label class="block text-label-caps font-label-caps mb-2">Email</label>
                    <input type="email" id="setup-email" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
                </div>
                <div>
                    <label class="block text-label-caps font-label-caps mb-2">Password</label>
                    <input type="password" id="setup-password" required minlength="6" class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
                </div>
                <button type="submit" class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase hover:bg-primary-container transition-colors duration-200">
                    Create Admin Account
                </button>
                <p id="setup-msg" class="text-body-md text-center hidden"></p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard (hidden by default) -->
    <div id="admin-section" class="hidden max-w-2xl mx-auto py-12 px-6">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-headline-lg font-headline-lg">Admin Dashboard</h1>
            <button onclick="logout()" class="text-primary hover:underline text-body-md">Logout</button>
        </div>

        <h2 class="text-headline-lg font-headline-lg mb-6">Add New Essay</h2>
        <form id="essay-form" class="flex flex-col gap-6">
            <div>
                <label class="block text-label-caps font-label-caps mb-2">Title</label>
                <input type="text" id="title" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
            </div>
            <div>
                <label class="block text-label-caps font-label-caps mb-2">Slug (URL-friendly, e.g., my-essay-title)</label>
                <input type="text" id="slug" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"/>
            </div>
            <div>
                <label class="block text-label-caps font-label-caps mb-2">Excerpt (short summary)</label>
                <textarea id="excerpt" rows="2" class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary"></textarea>
            </div>
            <div>
                <label class="block text-label-caps font-label-caps mb-2">Thumbnail Image</label>
                <input type="file" id="thumbnail" accept="image/*" class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-primary file:text-on-primary file:cursor-pointer"/>
                <p class="text-sm text-on-surface-variant mt-1">Upload an image for social media previews</p>
            </div>
            <div>
                <label class="block text-label-caps font-label-caps mb-2">Content (HTML allowed)</label>
                <textarea id="content" rows="15" required class="w-full border border-on-surface/20 px-4 py-3 text-body-md focus:outline-none focus:border-primary font-mono" placeholder="Write your essay here. Use blank lines between paragraphs."></textarea>
            </div>
            <button type="submit" class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase hover:bg-primary-container transition-colors duration-200 self-start">
                Publish Essay
            </button>
            <p id="msg" class="text-body-md hidden"></p>
        </form>

        <hr class="my-12 border-on-surface/20"/>

        <h2 class="text-headline-lg font-headline-lg mb-6">Existing Essays</h2>
        <div id="essays-list" class="flex flex-col gap-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://obttxpduyfcayhsbezni.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9idHR4cGR1eWZjYXloc2Jlem5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTY1NTAsImV4cCI6MjA5NDUzMjU1MH0.Ig_P6D7YtDR4pmXuEL04svp0FDz3pFHNYPVaA2x12cQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Simple hash function for password (in production, use proper hashing)
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(16);
        }

        // Check if admin exists
        async function checkAdmin() {
            const { data, error } = await supabaseClient
                .from('admin_users')
                .select('id')
                .limit(1);

            if (error) {
                console.error('Error checking admin:', error);
                return true; // Show setup if error
            }

            if (!data || data.length === 0) {
                // No admin exists, show setup form
                document.getElementById('login-form-container').classList.add('hidden');
                document.getElementById('setup-form-container').classList.remove('hidden');
                return false;
            }

            return true;
        }

        // Check if user is logged in
        function isLoggedIn() {
            const adminData = localStorage.getItem('admin_session');
            return adminData !== null;
        }

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('login-msg');
            const btn = e.target.querySelector('button');

            btn.textContent = 'Logging in...';
            btn.disabled = true;

            const { data, error } = await supabaseClient
                .from('admin_users')
                .select('*')
                .eq('email', email)
                .single();

            if (error || !data) {
                msgEl.textContent = 'Invalid email or password';
                msgEl.className = 'text-body-md text-red-600 text-center';
                msgEl.classList.remove('hidden');
                btn.textContent = 'Login';
                btn.disabled = false;
                return;
            }

            // Check password
            const hashedPassword = hashPassword(password);
            if (data.password !== hashedPassword) {
                msgEl.textContent = 'Invalid email or password';
                msgEl.className = 'text-body-md text-red-600 text-center';
                msgEl.classList.remove('hidden');
                btn.textContent = 'Login';
                btn.disabled = false;
                return;
            }

            // Login successful - save session
            localStorage.setItem('admin_session', JSON.stringify({ email: data.email, id: data.id }));
            showAdminDashboard();
        });

        // Setup first admin
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('setup-email').value;
            const password = document.getElementById('setup-password').value;
            const msgEl = document.getElementById('setup-msg');
            const btn = e.target.querySelector('button');

            btn.textContent = 'Creating...';
            btn.disabled = true;

            const hashedPassword = hashPassword(password);

            const { error } = await supabaseClient
                .from('admin_users')
                .insert({ email, password: hashedPassword });

            if (error) {
                msgEl.textContent = 'Error: ' + error.message;
                msgEl.className = 'text-body-md text-red-600 text-center';
                msgEl.classList.remove('hidden');
                btn.textContent = 'Create Admin Account';
                btn.disabled = false;
                return;
            }

            // Success - login automatically
            localStorage.setItem('admin_session', JSON.stringify({ email }));
            msgEl.textContent = 'Admin created! Loading dashboard...';
            msgEl.className = 'text-body-md text-green-600 text-center';
            msgEl.classList.remove('hidden');

            setTimeout(() => showAdminDashboard(), 1000);
        });

        function showAdminDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-section').classList.remove('hidden');
            loadEssays();
        }

        function logout() {
            localStorage.removeItem('admin_session');
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-form').reset();
            checkAdmin();
        }

        async function getEssays() {
            const { data, error } = await supabaseClient
                .from('essays')
                .select('*')
                .order('published_at', { ascending: false });
            return { data: data || [], error };
        }

        async function uploadImage(file) {
            const fileName = `${Date.now()}-${file.name}`;
            const { data, error } = await supabaseClient
                .storage
                .from('essays')
                .upload(fileName, file);

            if (error) throw error;

            const { data: urlData } = supabaseClient
                .storage
                .from('essays')
                .getPublicUrl(fileName);

            return urlData.publicUrl;
        }

        async function loadEssays() {
            const { data } = await getEssays();
            const list = document.getElementById('essays-list');
            if (!data || data.length === 0) {
                list.innerHTML = '<p class="text-on-surface-variant">No essays yet.</p>';
                return;
            }
            list.innerHTML = data.map(e => `
                <div class="border border-on-surface/10 p-4 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        ${e.thumbnail ? `<img src="${e.thumbnail}" class="w-12 h-12 object-cover rounded"/>` : ''}
                        <div>
                            <div class="font-bold">${e.title}</div>
                            <div class="text-sm text-on-surface-variant">${e.slug}</div>
                        </div>
                    </div>
                    <a href="essay.html?slug=${e.slug}" target="_blank" class="text-primary hover:underline text-sm">View</a>
                </div>
            `).join('');
        }

        document.getElementById('title').addEventListener('input', (e) => {
            const slug = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            document.getElementById('slug').value = slug;
        });

        document.getElementById('essay-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const slug = document.getElementById('slug').value;
            const excerpt = document.getElementById('excerpt').value;
            const content = document.getElementById('content').value;
            const thumbnailFile = document.getElementById('thumbnail').files[0];
            const msgEl = document.getElementById('msg');
            const btn = e.target.querySelector('button');

            btn.textContent = 'Publishing...';
            btn.disabled = true;

            let thumbnailUrl = null;
            try {
                if (thumbnailFile) {
                    thumbnailUrl = await uploadImage(thumbnailFile);
                }
            } catch (err) {
                console.error('Upload error:', err);
            }

            const { error } = await supabaseClient.from('essays').insert({
                title,
                slug,
                excerpt,
                content,
                thumbnail: thumbnailUrl
            });

            if (error) {
                msgEl.textContent = 'Error: ' + error.message;
                msgEl.className = 'text-body-md text-red-600 mt-2';
            } else {
                msgEl.textContent = '✓ Essay published!';
                msgEl.className = 'text-body-md text-green-600 mt-2';
                e.target.reset();
                loadEssays();
            }

            btn.textContent = 'Publish Essay';
            btn.disabled = false;
            msgEl.classList.remove('hidden');
            setTimeout(() => msgEl.classList.add('hidden'), 5000);
        });

        // Initialize
        (async function init() {
            if (isLoggedIn()) {
                showAdminDashboard();
            } else {
                await checkAdmin();
            }
        })();
    </script>
</body>
</html>
