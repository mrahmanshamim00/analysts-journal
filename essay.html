<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Essays | Analyst's Journal</title>

    <!-- Default Meta Tags -->
    <meta name="description" content="Independent political analysis and essays on politics, power, and governance."/>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://mrahmanshamim00.github.io/analysts-journal/essay.html"/>
    <meta property="og:title" content="Analyst's Journal | Independent Political Analysis"/>
    <meta property="og:description" content="Independent political analysis and essays on politics, power, and governance."/>
    <meta property="og:image" content="https://placehold.co/1200x630/8f000d/ffffff?text=Analyst%27s+Journal"/>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:url" content="https://mrahmanshamim00.github.io/analysts-journal/essay.html"/>
    <meta name="twitter:title" content="Analyst's Journal | Independent Political Analysis"/>
    <meta name="twitter:description" content="Independent political analysis and essays on politics, power, and governance."/>
    <meta name="twitter:image" content="https://mrahmanshamim00.github.io/analysts-journal/og-image.png"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#fbf9f9",
                        "primary-fixed-dim": "#ffb4ac",
                        "on-tertiary-container": "#d4d5d5",
                        error: "#ba1a1a",
                        "surface-dim": "#dbdad9",
                        "on-primary-fixed-variant": "#92030f",
                        "surface-tint": "#b52424",
                        "tertiary-container": "#5b5c5c",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-surface": "#1b1c1c",
                        "inverse-primary": "#ffb4ac",
                        "tertiary-fixed-dim": "#c6c6c7",
                        surface: "#fbf9f9",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#5a403e",
                        "surface-container-highest": "#e4e2e2",
                        "primary-fixed": "#ffdad6",
                        "surface-container": "#efeded",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#1c1b1b",
                        outline: "#8e706d",
                        "surface-variant": "#e4e2e2",
                        "surface-container-low": "#f5f3f3",
                        "on-primary-fixed": "#410003",
                        tertiary: "#434545",
                        "outline-variant": "#e2beba",
                        "on-primary-container": "#ffc8c2",
                        "secondary-container": "#e2dfde",
                        "on-tertiary-fixed": "#1a1c1c",
                        "surface-container-high": "#e9e8e7",
                        "inverse-on-surface": "#f2f0f0",
                        secondary: "#5f5e5e",
                        "on-background": "#1b1c1c",
                        "surface-bright": "#fbf9f9",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#e2e2e2",
                        primary: "#8f000d",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#474746",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-container": "#b22222",
                        "inverse-surface": "#303031",
                        "on-secondary-container": "#636262"
                    },
                    spacing: {
                        "section-gap": "80px",
                        "margin-mobile": "16px",
                        "reading-column": "720px",
                        "container-max": "1200px",
                        base: "8px",
                        gutter: "24px"
                    },
                    fontFamily: {
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Merriweather"],
                        "headline-md": ["Merriweather"],
                        "headline-lg": ["Merriweather"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Merriweather"],
                        "body-lg": ["Inter"],
                        quote: ["Merriweather"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "700" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "700" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-xl": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "900" }],
                        "body-lg": ["20px", { lineHeight: "1.7", fontWeight: "400" }],
                        quote: ["24px", { lineHeight: "1.5", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .prose p { margin-bottom: 1.5rem; }
        #toast {
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col pt-16">
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-on-surface text-surface-container-lowest px-6 py-4 rounded shadow-lg z-50">
        <span id="toast-msg"></span>
    </div>

    <!-- TopNavBar -->
    <nav class="bg-background fixed top-0 w-full border-b border-on-surface/10 z-50">
        <div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-16">
            <a class="text-headline-md font-headline-md font-black tracking-tight text-on-surface" href="index.html">
                Analyst's Journal
            </a>
            <div id="nav-menu" class="hidden md:flex items-center gap-8">
                <a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors duration-200" href="index.html">Home</a>
                <a class="text-primary border-b-2 border-primary pb-1 opacity-80 font-label-caps text-label-caps" href="essay.html">Essays</a>
                <a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors duration-200" href="about.html">About</a>
            </div>
            <div class="flex items-center gap-4">
                <button class="hidden md:block bg-on-surface text-surface-container-lowest font-label-caps text-label-caps px-6 py-3 hover:bg-primary transition-colors duration-200" onclick="scrollToSubscribe()">
                    Subscribe
                </button>
                <button class="md:hidden text-on-surface p-2" onclick="toggleMenu()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-background border-b border-on-surface/10 px-gutter py-4">
            <div class="flex flex-col gap-4">
                <a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors uppercase" href="index.html">Home</a>
                <a class="text-primary border-b-2 border-primary pb-1 text-label-caps font-label-caps uppercase" href="essay.html">Essays</a>
                <a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors uppercase" href="about.html">About</a>
                <button class="bg-on-surface text-surface-container-lowest font-label-caps text-label-caps px-6 py-3 hover:bg-primary transition-colors duration-200" onclick="scrollToSubscribe()">
                    Subscribe
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-reading-column mx-auto px-margin-mobile md:px-0 py-section-gap">
        <div id="content"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-inverse-surface w-full py-12 mt-section-gap border-t-4 border-primary">
        <div class="flex flex-col md:flex-row justify-between items-start w-full px-gutter max-w-container-max mx-auto gap-8">
            <div>
                <div class="text-headline-md font-headline-md text-surface-container-lowest mb-4">
                    Analyst's Journal
                </div>
                <div class="text-primary-fixed-dim text-body-md font-body-md">
                    © 2024 Independent Analysis. All rights reserved.
                </div>
            </div>
            <div class="flex flex-wrap gap-8">
                <a class="text-inverse-on-surface/70 hover:text-primary-fixed transition-all font-label-caps text-label-caps uppercase" href="#">Terms</a>
                <a class="text-inverse-on-surface/70 hover:text-primary-fixed transition-all font-label-caps text-label-caps uppercase" href="#">Privacy</a>
                <a class="text-inverse-on-surface/70 hover:text-primary-fixed transition-all font-label-caps text-label-caps uppercase" href="#">Contact</a>
            </div>
        </div>
    </footer>

    <script src="js/supabase.js"></script>
    <script>
        // Mobile menu toggle
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        // Toast notification
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = msg;
            toast.style.backgroundColor = isError ? '#ba1a1a' : '#303031';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // Scroll to subscribe
        function scrollToSubscribe() {
            document.getElementById('subscribe-section').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        // Share functions
        function shareTwitter() {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.title);
            window.open(`https://twitter.com/intent/tweet?url=${url}&text=${title}`, '_blank');
        }

        function shareFacebook() {
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast('Link copied to clipboard!');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        async function render() {
            const content = document.getElementById('content');

            if (slug) {
                // Show single essay
                const { data: essay, error } = await getEssayBySlug(slug);
                if (error || !essay) {
                    content.innerHTML = '<p class="text-body-lg">Essay not found.</p><a href="essay.html" class="text-primary hover:underline">← Back to Essays</a>';
                    return;
                }

                // Update meta tags for social sharing
                const siteUrl = 'https://mrahmanshamim00.github.io/analysts-journal';
                document.querySelector('meta[property="og:url"]').setAttribute('content', `${siteUrl}/essay.html?slug=${slug}`);
                document.querySelector('meta[name="twitter:url"]').setAttribute('content', `${siteUrl}/essay.html?slug=${slug}`);
                document.querySelector('meta[property="og:title"]').setAttribute('content', essay.title + ' | Analyst\'s Journal');
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', essay.title + ' | Analyst\'s Journal');
                document.querySelector('meta[property="og:description"]').setAttribute('content', essay.excerpt || essay.content.substring(0, 150) + '...');
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', essay.excerpt || essay.content.substring(0, 150) + '...');
                if (essay.thumbnail) {
                    document.querySelector('meta[property="og:image"]').setAttribute('content', essay.thumbnail);
                    document.querySelector('meta[name="twitter:image"]').setAttribute('content', essay.thumbnail);
                } else {
                    // Use a placeholder image when no thumbnail
                    document.querySelector('meta[property="og:image"]').setAttribute('content', 'https://placehold.co/1200x630/8f000d/ffffff?text=Analyst%27s+Journal');
                    document.querySelector('meta[name="twitter:image"]').setAttribute('content', 'https://placehold.co/1200x630/8f000d/ffffff?text=Analyst%27s+Journal');
                }
                document.title = essay.title + ' | Analyst\'s Journal';

                const { data: comments } = await getComments(essay.id);
                const publishedDate = new Date(essay.published_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                // Calculate reading time (rough estimate: 200 words per minute)
                const wordCount = essay.content.split(/\s+/).length;
                const readingTime = Math.max(1, Math.ceil(wordCount / 200));

                content.innerHTML = `
                    <header class="mb-12">
                        <a href="essay.html" class="text-label-caps font-label-caps text-primary uppercase mb-6 inline-block hover:text-primary-container transition-colors">← Back to Essays</a>
                        ${essay.thumbnail ? `<img src="${essay.thumbnail}" alt="${essay.title}" class="w-full h-64 object-cover rounded mb-6"/>` : ''}
                        <div class="flex items-center gap-4 text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">
                            <span>${publishedDate}</span>
                            <span>•</span>
                            <span>${readingTime} min read</span>
                        </div>
                        <h1 class="text-headline-xl font-headline-xl text-on-surface mb-6">${essay.title}</h1>
                        ${essay.excerpt ? `<p class="text-headline-md font-headline-md text-on-surface-variant mb-6">${essay.excerpt}</p>` : ''}
                        <!-- Share buttons -->
                        <div class="flex items-center gap-4 mt-4">
                            <span class="text-label-caps font-label-caps text-on-surface-variant">Share:</span>
                            <button onclick="shareTwitter()" class="text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">share</span>
                            </button>
                            <button onclick="shareFacebook()" class="text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">facebook</span>
                            </button>
                            <button onclick="copyLink()" class="text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">link</span>
                            </button>
                        </div>
                    </header>
                    <hr class="border-t border-on-surface/20 mb-12"/>
                    <article class="prose text-body-lg font-body-lg text-on-surface">
                        ${formatEssayContent(essay.content)}
                    </article>
                    <hr class="border-t border-on-surface/20 mt-16 mb-12"/>
                    <section>
                        <h2 class="text-headline-lg font-headline-lg text-on-surface mb-8">Comments (${comments.length})</h2>
                        <div id="comments-list" class="flex flex-col gap-6 mb-8">
                            ${comments.length > 0 ? comments.map(c => `
                                <div class="border border-on-surface/10 p-4 rounded">
                                    <div class="text-label-caps font-label-caps text-primary mb-2">${c.name}</div>
                                    <p class="text-body-md text-on-surface">${c.content}</p>
                                </div>
                            `).join('') : '<p class="text-on-surface-variant">No comments yet. Be the first to comment!</p>'}
                        </div>
                        <form id="comment-form" class="flex flex-col gap-4 bg-surface-container p-6">
                            <h3 class="text-headline-md font-headline-md text-on-surface mb-2">Leave a Comment</h3>
                            <input type="text" id="comment-name" required placeholder="Your name" class="bg-transparent border border-on-surface/20 px-4 py-3 text-body-md text-on-surface placeholder:text-on-surface/50 focus:outline-none focus:border-primary"/>
                            <textarea id="comment-content" required placeholder="Your comment" rows="3" class="bg-transparent border border-on-surface/20 px-4 py-3 text-body-md text-on-surface placeholder:text-on-surface/50 focus:outline-none focus:border-primary resize-none"></textarea>
                            <button type="submit" class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase hover:bg-primary-container transition-colors duration-200 self-start">
                                Post Comment
                            </button>
                        </form>
                    </section>
                    <!-- Newsletter Section -->
                    <section id="subscribe-section" class="bg-on-surface text-surface-container-lowest p-12 border border-on-surface mt-16">
                        <h2 class="text-headline-lg font-headline-lg mb-4">Enjoyed this essay?</h2>
                        <p class="text-body-md font-body-md mb-6 opacity-80">Subscribe for weekly analysis. No spam, unsubscribe anytime.</p>
                        <form id="subscribe-form" class="flex flex-col sm:flex-row gap-4">
                            <input type="email" id="sub-email" required placeholder="Your email address" class="flex-1 bg-transparent border border-surface-container-lowest px-4 py-3 text-body-md font-body-md text-surface-container-lowest placeholder:text-surface-container-lowest/50 focus:outline-none focus:border-primary"/>
                            <button type="submit" class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase hover:bg-primary-container transition-colors duration-200">
                                Subscribe
                            </button>
                        </form>
                    </section>
                `;

                // Comment form
                document.getElementById('comment-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('comment-name').value;
                    const commentContent = document.getElementById('comment-content').value;
                    const btn = e.target.querySelector('button');

                    btn.textContent = 'Posting...';
                    btn.disabled = true;

                    const { success, error } = await addComment(essay.id, name, commentContent);
                    if (success) {
                        showToast('✓ Comment posted!');
                        document.getElementById('comment-form').reset();
                        render();
                    } else {
                        showToast('Error: ' + (error?.message || 'Failed to post comment'), true);
                    }

                    btn.textContent = 'Post Comment';
                    btn.disabled = false;
                });

                // Subscribe form in essay page
                document.getElementById('subscribe-form')?.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('sub-email').value;
                    const btn = e.target.querySelector('button');
                    btn.textContent = 'Subscribing...';
                    btn.disabled = true;

                    const { success, error } = await subscribe(email);
                    if (success) {
                        showToast('✓ Thanks for subscribing!');
                        document.getElementById('sub-email').value = '';
                    } else {
                        showToast('Error: ' + (error?.message || 'Something went wrong'), true);
                    }

                    btn.textContent = 'Subscribe';
                    btn.disabled = false;
                });
            } else {
                // Show essay list
                const { data: essays } = await getEssays();

                if (!essays || essays.length === 0) {
                    content.innerHTML = `
                        <header class="mb-12">
                            <h1 class="text-headline-xl font-headline-xl text-on-surface mb-6">Essays</h1>
                            <p class="text-body-lg text-on-surface-variant">No essays published yet.</p>
                        </header>
                    `;
                    return;
                }

                content.innerHTML = `
                    <header class="mb-12">
                        <h1 class="text-headline-xl font-headline-xl text-on-surface mb-6">Essays</h1>
                        <p class="text-body-lg text-on-surface-variant">Analysis and commentary on politics, power, and governance.</p>
                    </header>
                    <hr class="border-t border-on-surface/20 mb-12"/>
                    <div class="flex flex-col gap-12">
                        ${essays.map(essay => {
                            const date = new Date(essay.published_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                            return `
                                <article class="flex gap-4 group border-b border-on-surface/10 pb-8 last:border-0">
                                    ${essay.thumbnail ? `<a href="essay.html?slug=${essay.slug}"><img src="${essay.thumbnail}" alt="${essay.title}" class="w-32 h-32 object-cover rounded flex-shrink-0 group-hover:opacity-80 transition-opacity"/></a>` : ''}
                                    <div class="flex flex-col gap-2">
                                        <span class="text-label-caps font-label-caps text-primary uppercase">${date}</span>
                                        <a href="essay.html?slug=${essay.slug}" class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-on-surface group-hover:text-primary transition-colors duration-200">${essay.title}</a>
                                        ${essay.excerpt ? `<p class="text-body-md font-body-md text-on-surface-variant">${essay.excerpt}</p>` : ''}
                                    </div>
                                </article>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        render();
    </script>
</body>
</html>
